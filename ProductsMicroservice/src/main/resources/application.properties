spring.kafka.bootstrap-servers=host.docker.internal:9092,host.docker.internal:9094,host.docker.internal:9096
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# retries = Kafka producer will retry sending message to kafka broker 10 times
# backoff.ms = The amount of time producer waits before attempting to retry a failed request 100ms = 1sec
# then it will try 10 times in 1 sec
#spring.kafka.producer.retries=10
#spring.kafka.producer.properties.retry.backoff.ms=1000

spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5